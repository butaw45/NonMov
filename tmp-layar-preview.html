<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview — LAYAR (Arsip Layar)</title>
<style>
  :root{
    --bg:#101216; --bg-deep:#0b0d10; --panel:#181b21; --panel-2:#1f232b;
    --ink:#e8e6df; --ink-dim:#c9c6bd; --muted:#8b8f98; --faint:#5c616b;
    --line:rgba(232,230,223,.08); --line-strong:rgba(232,230,223,.16);
    --accent:#d4a017; --accent-hi:#e8b93a; --accent-ink:#161003;
    --accent-2:#5b7f6e; --accent-2-hi:#6f9784; --danger:#b0473c;
    --font-display:"Space Grotesk",system-ui,sans-serif;
    --font-ui:"Inter",system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,monospace;
    --text-xs:.75rem; --text-sm:.875rem; --text-md:1rem; --text-lg:1.25rem; --text-xl:1.75rem; --text-2xl:2.5rem;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px;
    --radius:4px; --radius-lg:8px; --nav-h:60px; --container:1280px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:var(--text-md);line-height:1.55}
  .container{max-width:var(--container);margin:0 auto;padding:0 var(--sp-6)}
  /* top bar */
  .topbar{position:sticky;top:0;z-index:10;background:var(--bg-deep);border-bottom:1px solid var(--line)}
  .topbar-inner{display:flex;align-items:center;gap:var(--sp-6);height:var(--nav-h)}
  .brand{font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);letter-spacing:.02em}
  .nav{display:flex;gap:var(--sp-4)}
  .nav a{color:var(--ink-dim);font-size:var(--text-sm);padding:6px 10px;border-radius:var(--radius)}
  .nav a.on{color:var(--ink);background:var(--panel-2)}
  .search{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 12px}
  .search input{background:none;border:0;color:var(--ink);font-family:var(--font-ui);font-size:var(--text-sm);width:180px;outline:none}
  .menu{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;color:var(--ink-dim)}
  /* hero */
  .hero{position:relative;padding:var(--sp-12) 0;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background:linear-gradient(180deg,#1a1d24,#0e1013);opacity:.9}
  .hero-bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:3px 3px}
  .hero-content{position:relative;max-width:640px}
  .kicker{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-3)}
  .hero-title{font-family:var(--font-display);font-size:var(--text-2xl);line-height:1.1;margin-bottom:var(--sp-3)}
  .hero-meta{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--ink-dim);margin-bottom:var(--sp-4)}
  .hero-meta .star{color:var(--accent)}
  .hero-overview{color:var(--ink-dim);margin-bottom:var(--sp-6);max-width:520px}
  .actions{display:flex;gap:var(--sp-3)}
  .btn{font-family:var(--font-ui);font-size:var(--text-sm);font-weight:600;padding:10px 18px;border-radius:var(--radius);border:1px solid transparent;cursor:pointer}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{background:var(--accent-hi)}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-hi)}
  /* section */
  .section{padding:var(--sp-8) 0}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--sp-4)}
  .section-title{font-family:var(--font-display);font-size:var(--text-xl)}
  .strip{display:flex;gap:var(--sp-2)}
  .strip button{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 8px;min-width:32px}
  .strip button.on{color:var(--accent);border-color:var(--accent)}
  .row{display:grid;grid-auto-flow:column;grid-auto-columns:140px;gap:var(--sp-3);overflow-x:auto;padding-bottom:var(--sp-2)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .card-poster{aspect-ratio:2/3;background:linear-gradient(160deg,#20242c,#14161b);display:flex;align-items:flex-end;padding:var(--sp-2);font-family:var(--font-mono);font-size:10px;color:var(--muted)}
  .card-caption{padding:var(--sp-2)}
  .card-title{font-size:var(--text-xs);font-weight:600;display:block}
  .card-meta{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
  footer{border-top:1px solid var(--line);padding:var(--sp-6) 0;color:var(--muted);font-size:var(--text-xs);text-align:center}
</style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">LAYAR</div>
      <nav class="nav">
        <a href="#" class="on">Beranda</a>
        <a href="#">Film</a>
        <a href="#">Series</a>
      </nav>
      <div class="search"><span>&#128269;</span><input placeholder="Cari film, series..." /></div>
      <button class="menu">=</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="container hero-content">
      <div class="kicker">NO. 00124 &middot; ARSIP MINGGU INI</div>
      <h1 class="hero-title">Judul Besar Sekali</h1>
      <div class="hero-meta"><span class="star">&#9733; 8.4</span> &middot; 2024 &middot; Film &middot; 2j 10m</div>
      <p class="hero-overview">Sinopsis singkat dua-tiga kalimat yang menjelaskan kenapa judul ini masuk arsip minggu ini. Tenang, terkurasi, tidak menjual.</p>
      <div class="actions">
        <button class="btn btn-primary">&#9654; Tonton</button>
        <button class="btn btn-ghost">+ Simpan</button>
      </div>
    </div>
  </section>

  <section class="section container">
    <div class="section-head">
      <h2 class="section-title">Arsip Terbaru</h2>
      <div class="strip" id="strip"></div>
    </div>
    <div class="row" id="row"></div>
  </section>

  <footer>
    <div class="container">LAYAR &middot; Arsip pribadi &middot; Bukan afiliasi TMDB</div>
  </footer>

<script>
  const titles = ['Judul A','Judul B','Judul C','Judul D','Judul E','Judul F','Judul G','Judul H'];
  const row = document.getElementById('row');
  const strip = document.getElementById('strip');
  titles.forEach((t,i)=>{
    const no = String(124+i).padStart(5,'0');
    row.insertAdjacentHTML('beforeend',
      `<div class="card"><div class="card-poster">NO. ${no}</div>
       <div class="card-caption"><span class="card-title">${t}</span>
       <span class="card-meta">2024 &middot; Film</span></div></div>`);
    strip.insertAdjacentHTML('beforeend',
      `<button class="${i===0?'on':''}" data-i="${i}">${String(i+1).padStart(2,'0')}</button>`);
  });
  strip.addEventListener('click', e=>{
    if (e.target.tagName !== 'BUTTON') return;
    strip.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    e.target.classList.add('on');
    const card = row.children[+e.target.dataset.i];
    card.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  });
</script>
</body>
</html>
